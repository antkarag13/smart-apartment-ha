  <clipPath id="clip-storage"><polygon points="280,404 370,404 370,524 280,524"/></clipPath>
  <clipPath id="clip-wc"><polygon points="280,532 370,532 370,706 280,685"/></clipPath>
  <clipPath id="clip-kitchen"><polygon points="378,404 540,404 540,746 378,708"/></clipPath>
  <clipPath id="clip-dining"><polygon points="540,210 795,210 795,404 540,404"/></clipPath>
  <clipPath id="clip-living"><polygon points="540,404 795,404 795,806 540,746"/></clipPath>
  <clipPath id="clip-be"><polygon points="818,30 890,30 890,835 818,812"/></clipPath>
  <clipPath id="clip-bs"><polygon points="5,621 818,811 890,835 890,905 5,720"/></clipPath>
