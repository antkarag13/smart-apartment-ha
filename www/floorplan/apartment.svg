  <g id="light.kitchen_ceiling" class="light light-off"><polygon class="hit" points="378,404 540,404 540,746 378,708"/><rect class="glow" x="0" y="0" width="900" height="920" fill="url(#glow)" clip-path="url(#clip-kitchen)"/></g>
  <g id="light.dining_pendant" class="light light-off"><polygon class="hit" points="540,210 795,210 795,404 540,404"/><rect class="glow" x="0" y="0" width="900" height="920" fill="url(#glow)" clip-path="url(#clip-dining)"/></g>
