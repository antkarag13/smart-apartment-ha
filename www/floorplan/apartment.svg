  <pattern id="deck" patternUnits="userSpaceOnUse" width="14" height="14"><rect width="14" height="14" fill="#141d29"/><path d="M0,14 L14,0" stroke="#1f2a38" stroke-width="2"/></pattern>
  <pattern id="stairs" patternUnits="userSpaceOnUse" width="18" height="18"><rect width="18" height="18" fill="#121923"/><path d="M0,9 H18" stroke="#1d2735" stroke-width="2"/></pattern>

  <clipPath id="clip-study_bedroom"><polygon points="180,30 405,30 405,300 180,300"/></clipPath>
