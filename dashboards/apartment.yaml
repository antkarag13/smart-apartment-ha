        font-size: 13px
        font-weight: '600'
- title: Climate
  path: climate
  icon: mdi:thermostat
  cards:
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.study_bedroom
      name: Study bedroom
    - type: entities
      entities:
      - entity: input_number.study_bedroom_target_temperature
        name: Room target
      - entity: sensor.study_bedroom_temperature
        name: Room temperature (FP300)
      - entity: sensor.study_bedroom_humidity
        name: Humidity
      - entity: sensor.study_bedroom_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.small_bedroom
      name: Small bedroom
    - type: entities
      entities:
      - entity: input_number.small_bedroom_target_temperature
        name: Room target
      - entity: sensor.small_bedroom_temperature
        name: Room temperature (FP300)
      - entity: sensor.small_bedroom_humidity
        name: Humidity
      - entity: sensor.small_bedroom_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.double_bedroom
      name: Double bedroom
    - type: entities
      entities:
      - entity: input_number.double_bedroom_target_temperature
        name: Room target
      - entity: sensor.double_bedroom_temperature
        name: Room temperature (FP300)
      - entity: sensor.double_bedroom_humidity
        name: Humidity
      - entity: sensor.double_bedroom_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.living_room
      name: Living room (E4)
    - type: entities
      entities:
      - entity: input_number.living_room_target_temperature
        name: Room target
      - entity: sensor.kitchen_temperature
        name: Room temperature (FP300)
      - entity: sensor.kitchen_humidity
        name: Humidity
      - entity: sensor.living_room_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.kitchen_dining
      name: Kitchen / dining (E5)
    - type: entities
      entities:
      - entity: input_number.kitchen_dining_target_temperature
        name: Room target
      - entity: sensor.dining_temperature
        name: Room temperature (FP300)
      - entity: sensor.dining_humidity
        name: Humidity
      - entity: sensor.kitchen_dining_ac_filter_hours
        name: Filter hours
  - type: entities
    title: Filters
    entities:
    - input_number.ac_filter_hours_limit
    - input_button.ac_filters_cleaned
  - type: entities
    title: Indoor vs outdoor
    entities:
    - sensor.indoor_temperature
    - type: attribute
      entity: weather.forecast_home
      attribute: temperature
      name: Outdoor temperature
      suffix: °C
- title: Energy
  path: energy
  icon: mdi:lightning-bolt
  cards:
  - type: entities
    title: Now
    entities:
    - sensor.mains_power
    - sensor.electricity_cost_today
    - sensor.electricity_cost_month
    - sensor.electricity_bill_forecast
    - input_boolean.load_shed
  - type: history-graph
    title: House power, 24 h
    hours_to_show: 24
    entities:
    - sensor.mains_power
  - type: entities
    title: Water heater
    entities:
    - switch.water_heater
    - input_button.water_heater_boost
    - timer.water_heater_boost
    - schedule.water_heater
  - type: entities
    title: Appliances
    entities:
    - sensor.washing_machine_power
    - input_boolean.washer_running
    - sensor.freezer_temperature
    - sensor.freezer_power
    - input_boolean.freezer_alert
  - type: entities
    title: Settings
    entities:
    - input_number.electricity_price
    - input_number.electricity_fixed_monthly
    - input_number.max_house_power
- title: Home
  path: home
  icon: mdi:home-automation
  cards:
  - type: alarm-panel
    entity: alarm_control_panel.home
    states:
    - arm_away
    - arm_night
  - type: entities
    title: House
    entities:
    - input_select.house_mode
    - input_boolean.guest_mode
  - type: entities
    title: Water
    entities:
    - binary_sensor.storage_leak
    - binary_sensor.kitchen_sink_leak
  - type: entities
    title: Manual light overrides
    show_header_toggle: false
    entities:
    - input_boolean.study_bedroom_light_override
    - input_boolean.small_bedroom_light_override
    - input_boolean.double_bedroom_light_override
    - input_boolean.bathroom_light_override
    - input_boolean.wc_light_override
    - input_boolean.storage_light_override
    - input_boolean.living_room_light_override
    - input_boolean.kitchen_light_override
    - input_boolean.dining_light_override
