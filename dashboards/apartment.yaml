      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 9.9%
        top: 45.7%
        --mdc-icon-size: 30px
    - type: state-icon
      entity: binary_sensor.double_bedroom_presence
      icon: mdi:account
      style:
        left: 13.8%
        top: 45.7%
