# Lovelace dashboard (YAML mode). Registered in configuration.example.yaml.
# The floor plan is drawing 9γ of the renovation, served from
# www/floorplan/apartment.svg. Icons sit on the rooms; tap a light to toggle
# it, a window or leak icon appears only while it is open / wet.

title: Apartment
views:
- title: Floor plan
  path: floor
  icon: mdi:floor-plan
  panel: true
  cards:
  - type: picture-elements
    image: /local/floorplan/apartment.svg
    elements:
    - type: state-icon
      entity: light.study_bedroom_ceiling
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 32.4%
        top: 19.6%
        --mdc-icon-size: 30px
    - type: state-icon
      entity: binary_sensor.study_bedroom_presence
      icon: mdi:account
      style:
        left: 36.3%
        top: 19.6%
        --mdc-icon-size: 22px
    - type: state-label
      entity: sensor.study_bedroom_temperature
      style:
        left: 32.4%
        top: 23.5%
        background: rgba(255,255,255,0.85)
        border-radius: 10px
        padding: 0 6px
        color: '#222'
        font-size: 13px
        font-weight: '600'
    - type: state-icon
      entity: light.small_bedroom_ceiling
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      style:
        left: 10.9%
        top: 28.3%
        --mdc-icon-size: 30px
    - type: state-icon
      entity: binary_sensor.small_bedroom_presence
      icon: mdi:account
      style:
        left: 14.8%
        top: 28.3%
        --mdc-icon-size: 22px
