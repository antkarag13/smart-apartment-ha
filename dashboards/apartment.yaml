# Lovelace dashboard (YAML mode). Registered in configuration.example.yaml.
#
# The Floor plan view uses ha-floorplan (HACS → Frontend → "Floorplan"):
# every room, lamp, sensor and A/C unit in www/floorplan/apartment.svg has the
# entity ID as its element id, and the rules below set CSS classes from the
# entity's state (styles in www/floorplan/apartment.css).
#   - tap a room → its light toggles; hold → more-info
#   - presence glows teal, A/C icons turn orange (heat) / blue (cool)
#   - an open window blinks red, a wet leak sensor pulses blue

title: Apartment
views:
- title: Floor plan
  path: floor
  icon: mdi:floor-plan
  panel: true
  cards:
  - type: custom:floorplan-card
    full_height: true
    config:
      image: /local/floorplan/apartment.svg
      stylesheet: /local/floorplan/apartment.css
      rules:
      - name: 'Lights: tap a room to switch its light'
        entities:
        - light.study_bedroom_ceiling
        - light.small_bedroom_ceiling
        - light.double_bedroom_ceiling
        - light.hallway
        - light.bathroom
        - light.storage
        - light.wc
        - light.kitchen_ceiling
        - light.dining_pendant
        - light.living_room_ceiling
        - light.kitchen_island_pendant
        - light.kitchen_counter_led
        - light.balcony_east
        - light.balcony_south
        tap_action: toggle
        hold_action: more-info
        hover_action: hover-info
        state_action:
          action: call-service
          service: floorplan.class_set
          service_data:
            class: light-${entity.state}
      - name: Presence
        entities:
        - binary_sensor.study_bedroom_presence
        - binary_sensor.small_bedroom_presence
        - binary_sensor.double_bedroom_presence
        - binary_sensor.bathroom_presence
        - binary_sensor.wc_presence
        - binary_sensor.storage_presence
        - binary_sensor.kitchen_presence
        - binary_sensor.dining_presence
        state_action:
          action: call-service
          service: floorplan.class_set
          service_data:
            class: presence-${entity.state}
      - name: Room temperatures
        entities:
        - sensor.study_bedroom_temperature
        - sensor.small_bedroom_temperature
        - sensor.double_bedroom_temperature
        - sensor.kitchen_temperature
        - sensor.dining_temperature
        tap_action: more-info
        state_action:
          action: call-service
          service: floorplan.text_set
          service_data:
            text: '${[''unavailable'',''unknown''].includes(entity.state) ? ''–'' : Number(entity.state).toFixed(1) + ''°''}'
      - name: Room humidity
        entities:
        - sensor.study_bedroom_humidity
        - sensor.small_bedroom_humidity
        - sensor.double_bedroom_humidity
        - sensor.kitchen_humidity
        - sensor.dining_humidity
        state_action:
          action: call-service
          service: floorplan.text_set
          service_data:
            text: '${[''unavailable'',''unknown''].includes(entity.state) ? ''– %'' : Math.round(entity.state) + '' %''}'
      - name: 'A/C units: colour by mode, tap for the thermostat'
        entities:
        - climate.study_bedroom
        - climate.small_bedroom
        - climate.double_bedroom
        - climate.living_room
        - climate.kitchen_dining
        tap_action: more-info
        hover_action: hover-info
        state_action:
          action: call-service
          service: floorplan.class_set
          service_data:
            class: climate-${entity.state}
      - name: Windows and balcony doors
        entities:
        - binary_sensor.study_bedroom_window
        - binary_sensor.small_bedroom_window
        - binary_sensor.bathroom_window
        - binary_sensor.double_bedroom_window
        - binary_sensor.kitchen_window
        - binary_sensor.living_room_window
        - binary_sensor.balcony_east_door
        - binary_sensor.balcony_south_door
        hover_action: hover-info
        state_action:
          action: call-service
          service: floorplan.class_set
          service_data:
            class: open-${entity.state}
      - name: Leak sensors
        entities:
        - binary_sensor.storage_leak
        - binary_sensor.kitchen_sink_leak
        state_action:
          action: call-service
          service: floorplan.class_set
          service_data:
            class: leak-${entity.state}
      - name: Status panel
        entities:
        - input_select.house_mode
        tap_action: more-info
        state_action:
          action: call-service
          service: floorplan.text_set
          service_data:
            text: ${entity.state}
      - entities:
        - alarm_control_panel.home
        tap_action: more-info
        state_action:
          action: call-service
          service: floorplan.text_set
          service_data:
            text: ${({disarmed:'Off',armed_away:'Away',armed_night:'Night',arming:'Arming',pending:'Entry',triggered:'ALARM'})[entity.state]
              || entity.state}
      - entities:
        - sensor.mains_power
        tap_action: more-info
        state_action:
          action: call-service
          service: floorplan.text_set
          service_data:
            text: ${Math.round(entity.state) + ' W'}
      - entities:
        - sensor.electricity_cost_today
        tap_action: more-info
        state_action:
          action: call-service
          service: floorplan.text_set
          service_data:
            text: ${Number(entity.state).toFixed(2) + ' €'}
- title: Climate
  path: climate
  icon: mdi:thermostat
  cards:
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.study_bedroom
      name: Bedroom 1
    - type: entities
      entities:
      - entity: input_number.study_bedroom_target_temperature
        name: Room target
      - entity: sensor.study_bedroom_temperature
        name: Room temperature (FP300)
      - entity: sensor.study_bedroom_humidity
        name: Humidity
      - entity: sensor.study_bedroom_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.small_bedroom
      name: Bedroom 2
    - type: entities
      entities:
      - entity: input_number.small_bedroom_target_temperature
        name: Room target
      - entity: sensor.small_bedroom_temperature
        name: Room temperature (FP300)
      - entity: sensor.small_bedroom_humidity
        name: Humidity
      - entity: sensor.small_bedroom_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.double_bedroom
      name: Double bedroom
    - type: entities
      entities:
      - entity: input_number.double_bedroom_target_temperature
        name: Room target
      - entity: sensor.double_bedroom_temperature
        name: Room temperature (FP300)
      - entity: sensor.double_bedroom_humidity
        name: Humidity
      - entity: sensor.double_bedroom_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.living_room
      name: Living room (E4)
    - type: entities
      entities:
      - entity: input_number.living_room_target_temperature
        name: Room target
      - entity: sensor.kitchen_temperature
        name: Room temperature (FP300)
      - entity: sensor.kitchen_humidity
        name: Humidity
      - entity: sensor.living_room_ac_filter_hours
        name: Filter hours
  - type: vertical-stack
    cards:
    - type: thermostat
      entity: climate.kitchen_dining
      name: Kitchen / dining (E5)
    - type: entities
      entities:
      - entity: input_number.kitchen_dining_target_temperature
        name: Room target
      - entity: sensor.dining_temperature
        name: Room temperature (FP300)
      - entity: sensor.dining_humidity
        name: Humidity
      - entity: sensor.kitchen_dining_ac_filter_hours
        name: Filter hours
  - type: entities
    title: Filters
    entities:
    - input_number.ac_filter_hours_limit
    - input_button.ac_filters_cleaned
  - type: entities
    title: Indoor vs outdoor
    entities:
    - sensor.indoor_temperature
    - type: attribute
      entity: weather.forecast_home
      attribute: temperature
      name: Outdoor temperature
      suffix: °C
- title: Energy
  path: energy
  icon: mdi:lightning-bolt
  cards:
  - type: entities
    title: Now
    entities:
    - sensor.mains_power
    - sensor.electricity_cost_today
    - sensor.electricity_cost_month
    - sensor.electricity_bill_forecast
    - input_boolean.load_shed
  - type: history-graph
    title: House power, 24 h
    hours_to_show: 24
    entities:
    - sensor.mains_power
  - type: entities
    title: Water heater
    entities:
    - switch.water_heater
    - input_button.water_heater_boost
    - timer.water_heater_boost
    - schedule.water_heater
  - type: entities
    title: Appliances
    entities:
    - sensor.washing_machine_power
    - input_boolean.washer_running
    - sensor.freezer_temperature
    - sensor.freezer_power
    - input_boolean.freezer_alert
  - type: entities
    title: Settings
    entities:
    - input_number.electricity_price
    - input_number.electricity_fixed_monthly
    - input_number.max_house_power
- title: Home
  path: home
  icon: mdi:home-automation
  cards:
  - type: alarm-panel
    entity: alarm_control_panel.home
    states:
    - arm_away
    - arm_night
  - type: entities
    title: House
    entities:
    - input_select.house_mode
    - input_boolean.guest_mode
  - type: entities
    title: Water
    entities:
    - binary_sensor.storage_leak
    - binary_sensor.kitchen_sink_leak
  - type: entities
    title: Manual light overrides
    show_header_toggle: false
    entities:
    - input_boolean.study_bedroom_light_override
    - input_boolean.small_bedroom_light_override
    - input_boolean.double_bedroom_light_override
    - input_boolean.bathroom_light_override
    - input_boolean.wc_light_override
    - input_boolean.storage_light_override
    - input_boolean.living_room_light_override
    - input_boolean.kitchen_light_override
    - input_boolean.dining_light_override
