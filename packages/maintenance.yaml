# =============================================================================
#  MAINTENANCE
#  The boring jobs nobody remembers: batteries, devices that drop off the
#  Zigbee network, and the filters of the five ducted A/C units, which sit
#  behind access hatches in the ceilings and are easy to forget.
# =============================================================================

# A/C filters: counted in real running hours per unit, not calendar days.
# history_stats gives each unit's hours today; a utility_meter (no cycle)
# adds the days up until the filters are cleaned and the counter is reset.
sensor:
  - platform: history_stats
    name: Bedroom 1 bedroom AC runtime today
    unique_id: antonis_bedroom_ac_runtime_today
    entity_id: climate.antonis_bedroom
    state: [heat, cool, dry, fan_only, heat_cool, auto]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Bedroom 2 bedroom AC runtime today
    unique_id: emmanouela_bedroom_ac_runtime_today
    entity_id: climate.emmanouela_bedroom
    state: [heat, cool, dry, fan_only, heat_cool, auto]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Master bedroom AC runtime today
    unique_id: master_bedroom_ac_runtime_today
    entity_id: climate.master_bedroom
    state: [heat, cool, dry, fan_only, heat_cool, auto]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Living room AC runtime today
    unique_id: living_room_ac_runtime_today
    entity_id: climate.living_room
    state: [heat, cool, dry, fan_only, heat_cool, auto]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Kitchen dining AC runtime today
    unique_id: kitchen_dining_ac_runtime_today
    entity_id: climate.kitchen_dining
    state: [heat, cool, dry, fan_only, heat_cool, auto]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

utility_meter:
  antonis_bedroom_ac_filter_hours:
    name: Bedroom 1 AC filter hours
    unique_id: antonis_bedroom_ac_filter_hours
    source: sensor.antonis_bedroom_ac_runtime_today
    periodically_resetting: true
  emmanouela_bedroom_ac_filter_hours:
    name: Bedroom 2 AC filter hours
    unique_id: emmanouela_bedroom_ac_filter_hours
    source: sensor.emmanouela_bedroom_ac_runtime_today
    periodically_resetting: true
  master_bedroom_ac_filter_hours:
    name: Master bedroom AC filter hours
    unique_id: master_bedroom_ac_filter_hours
    source: sensor.master_bedroom_ac_runtime_today
    periodically_resetting: true
  living_room_ac_filter_hours:
    name: Living room AC filter hours
    unique_id: living_room_ac_filter_hours
    source: sensor.living_room_ac_runtime_today
    periodically_resetting: true
  kitchen_dining_ac_filter_hours:
    name: Kitchen dining AC filter hours
    unique_id: kitchen_dining_ac_filter_hours
    source: sensor.kitchen_dining_ac_runtime_today
    periodically_resetting: true

input_number:
  ac_filter_hours_limit:
    name: A/C filter cleaning interval
    icon: mdi:air-filter
    min: 50
    max: 1000
    step: 25
    unit_of_measurement: h
    mode: box

input_button:
  ac_filters_cleaned:
    name: A/C filters cleaned
    icon: mdi:air-filter

automation:
  - id: maintenance_filters_cleaned
    alias: Maintenance - Reset A/C filter hours
    triggers:
      - trigger: state
        entity_id: input_button.ac_filters_cleaned
        not_from:
          - unavailable
          - unknown
    actions:
      - action: utility_meter.calibrate
        target:
          entity_id:
          - sensor.antonis_bedroom_ac_filter_hours
          - sensor.emmanouela_bedroom_ac_filter_hours
          - sensor.master_bedroom_ac_filter_hours
          - sensor.living_room_ac_filter_hours
          - sensor.kitchen_dining_ac_filter_hours
        data:
          value: "0"
    mode: single

  - id: maintenance_filters_reminder
    alias: Maintenance - A/C filter reminder by running hours
    description: >
      Fires when a unit's filter passes the cleaning interval (300 h is a good
      start for a dusty city flat), then reminds every Saturday until the
      filters are cleaned and the button pressed. The message lists every
      unit over the limit and where its access hatch is.
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.antonis_bedroom_ac_filter_hours
          - sensor.emmanouela_bedroom_ac_filter_hours
          - sensor.master_bedroom_ac_filter_hours
          - sensor.living_room_ac_filter_hours
          - sensor.kitchen_dining_ac_filter_hours
        above: input_number.ac_filter_hours_limit
        id: crossed
      - trigger: time
        at: "10:00:00"
    variables:
      hatches:
        sensor.antonis_bedroom_ac_filter_hours: main WC ceiling (E1)
        sensor.emmanouela_bedroom_ac_filter_hours: hallway, west end (E2)
        sensor.master_bedroom_ac_filter_hours: storage room (E3)
        sensor.living_room_ac_filter_hours: hallway, east end (E4)
        sensor.kitchen_dining_ac_filter_hours: hallway, middle (E5)
      limit: "{{ states('input_number.ac_filter_hours_limit') | float(300) }}"
      due: >
        {% set ns = namespace(out=[]) %}
        {% for e, where in hatches.items() %}
          {% if states(e) | float(0) >= limit %}
            {% set ns.out = ns.out + [state_attr(e, 'friendly_name') ~ ': '
                ~ states(e) | float | round(0) | int ~ ' h, hatch in the ' ~ where] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}
    conditions:
      - "{{ due | count > 0 }}"
      - condition: or
        conditions:
          - condition: trigger
            id: crossed
          - condition: time
            weekday: sat
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.family
        data:
          title: Clean the A/C filters
          message: "{{ due | join('\n') }}"
    mode: single

  - id: maintenance_battery_report
    alias: Maintenance - Weekly low battery report
    description: >
      Every Sunday, lists every battery-powered device (window contacts,
      SNZB-06P) below 20 %, so batteries get replaced before the alarm loses
      a sensor.
    triggers:
      - trigger: time
        at: "11:00:00"
    variables:
      lines: >
        {% set ns = namespace(out=[]) %}
        {% for s in states.sensor
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             if s.state | is_number and s.state | float < 20 %}
          {% set ns.out = ns.out + [s.name ~ ': ' ~ s.state ~ ' %'] %}
        {% endfor %}
        {{ ns.out }}
    conditions:
      - condition: time
        weekday: sun
      - "{{ lines | count > 0 }}"
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.family
        data:
          title: "Low batteries ({{ lines | count }})"
          message: "{{ lines | join('\n') }}"
    mode: single

  - id: maintenance_device_offline
    alias: Maintenance - Zigbee relay or plug offline
    description: >
      Every mains-powered Zigbee device is also a router for the mesh, so one
      going offline for 10 minutes is worth knowing about (tripped breaker,
      failed relay).
    triggers:
      - trigger: state
        entity_id:
          - light.antonis_bedroom_ceiling
          - light.emmanouela_bedroom_ceiling
          - light.master_bedroom_ceiling
          - light.hallway
          - light.main_wc
          - light.storage
          - light.master_wc
          - light.kitchen_counter_led
          - light.balcony_east
          - light.balcony_south
          - light.kitchen_ceiling
          - light.kitchen_island_pendant
          - light.living_room_ceiling
          - light.dining_pendant
          - switch.washing_machine
          - switch.freezer
          - switch.water_heater
        to: unavailable
        for:
          minutes: 10
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.family
        data:
          title: Device offline
          message: "{{ trigger.to_state.name }} has been offline for 10 minutes."
    mode: parallel
