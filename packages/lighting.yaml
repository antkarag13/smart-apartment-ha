# =============================================================================
#  LIGHTING
#  Every light point has a SONOFF Zigbee relay behind its wall switch
#  (ZBMINIR2 / ZBMINIL2 single, MINI DUO double), so the switches keep working
#  normally and Home Assistant sees every light. Relays are exposed as `light`
#  entities (Settings → Helpers → "Change device type of a switch").
#
#  Each room runs one instance of the presence-lighting blueprint, driven by
#  that room's Aqara FP300 mmWave sensor (storage: SONOFF SNZB-06P).
# =============================================================================

input_boolean:
  antonis_bedroom_light_override:
    name: Bedroom 1 light override
    icon: mdi:hand-back-left
  emmanouela_bedroom_light_override:
    name: Bedroom 2 light override
    icon: mdi:hand-back-left
  master_bedroom_light_override:
    name: Master bedroom light override
    icon: mdi:hand-back-left
  main_wc_light_override:
    name: Main WC light override
    icon: mdi:hand-back-left
  master_wc_light_override:
    name: Master WC light override
    icon: mdi:hand-back-left
  storage_light_override:
    name: Storage light override
    icon: mdi:hand-back-left
  living_room_light_override:
    name: Living room light override
    icon: mdi:hand-back-left
  kitchen_light_override:
    name: Kitchen light override
    icon: mdi:hand-back-left
  dining_light_override:
    name: Dining light override
    icon: mdi:hand-back-left
  hallway_path_light:
    name: Hallway on as night path light
    icon: mdi:shoe-print

# The open-plan space has two FP300s: F6 over the dining table (by the front
# door) and F7 covering the kitchen and the living room. Together they make one
# "is anyone in the living space" sensor.
binary_sensor:
  - platform: group
    name: Living room presence
    unique_id: living_room_presence_group
    device_class: occupancy
    entities:
      - binary_sensor.dining_presence
      - binary_sensor.kitchen_presence

automation:
  # ---------------------------------------------------------------- bedrooms
  # Lights follow presence in the evening, but never switch on by themselves
  # in Night mode.
  - id: lighting_antonis_bedroom
    alias: Lighting - Bedroom 1 presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.antonis_bedroom_presence
        main_light: light.antonis_bedroom_ceiling
        illuminance_sensor: sensor.antonis_bedroom_illuminance
        night_behavior: "off"
        off_delay: 300
        override_helper: input_boolean.antonis_bedroom_light_override

  - id: lighting_emmanouela_bedroom
    alias: Lighting - Bedroom 2 presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.emmanouela_bedroom_presence
        main_light: light.emmanouela_bedroom_ceiling
        illuminance_sensor: sensor.emmanouela_bedroom_illuminance
        night_behavior: "off"
        off_delay: 300
        override_helper: input_boolean.emmanouela_bedroom_light_override

  - id: lighting_master_bedroom
    alias: Lighting - Master bedroom presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.master_bedroom_presence
        main_light: light.master_bedroom_ceiling
        illuminance_sensor: sensor.master_bedroom_illuminance
        night_behavior: "off"
        off_delay: 300
        override_helper: input_boolean.master_bedroom_light_override

  # -------------------------------------------------------------- wet rooms
  # Bathroom, WC and storage get little daylight, so they ignore lux and
  # always light up, day or night. mmWave sees a still person, so the light
  # never goes off on someone in the shower.
  - id: lighting_bathroom
    alias: Lighting - Main WC presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.main_wc_presence
        main_light: light.main_wc
        off_delay: 60
        override_helper: input_boolean.main_wc_light_override

  - id: lighting_wc
    alias: Lighting - Master WC presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.master_wc_presence
        main_light: light.master_wc
        off_delay: 60
        override_helper: input_boolean.master_wc_light_override

  - id: lighting_storage
    alias: Lighting - Storage presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.storage_presence
        main_light: light.storage
        off_delay: 30
        override_helper: input_boolean.storage_light_override

  # ------------------------------------------------------------- day zone
  # Kitchen at night: only the counter LED, enough for a glass of water.
  - id: lighting_kitchen
    alias: Lighting - Kitchen presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.kitchen_presence
        main_light: light.kitchen_ceiling
        night_light: light.kitchen_counter_led
        night_behavior: night_light
        illuminance_sensor: sensor.kitchen_illuminance
        off_delay: 300
        override_helper: input_boolean.kitchen_light_override

  - id: lighting_living_room
    alias: Lighting - Living room presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.living_room_presence
        main_light: light.living_room_ceiling
        illuminance_sensor: sensor.kitchen_illuminance
        night_behavior: "off"
        off_delay: 600
        override_helper: input_boolean.living_room_light_override

  # Coming in through the front door after dark: the dining pendant lights up.
  - id: lighting_dining
    alias: Lighting - Dining presence
    use_blueprint:
      path: antkarag13/presence_lighting.yaml
      input:
        presence_sensor: binary_sensor.dining_presence
        main_light: light.dining_pendant
        illuminance_sensor: sensor.dining_illuminance
        night_behavior: "off"
        off_delay: 300
        override_helper: input_boolean.dining_light_override

  # ------------------------------------------------------------- house modes
  - id: lighting_house_mode
    alias: Lighting - Follow house mode
    description: >
      Away/Vacation: every light in the apartment off. Night: lights in the day
      zone, hallway and balconies off (bedrooms are left alone).
    triggers:
      - trigger: state
        entity_id: input_select.house_mode
        to:
          - Away
          - Vacation
        id: away
      - trigger: state
        entity_id: input_select.house_mode
        to: Night
        id: night
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: away
            sequence:
              - action: light.turn_off
                target:
                  floor_id: apartment
          - conditions:
              - condition: trigger
                id: night
            sequence:
              - action: light.turn_off
                target:
                  area_id:
                    - living_room
                    - hallway
                    - balcony_east
                    - balcony_south
    mode: queued

  # --------------------------------------------------------------- hallway
  # The hallway (three-way switch, no sensor) is the one light people forget.
  - id: lighting_hallway_timeout
    alias: Lighting - Hallway auto-off
    description: Off after 10 min at night or 30 min during the day.
    triggers:
      - trigger: state
        entity_id: light.hallway
        to: "on"
        for:
          minutes: 10
        id: short
      - trigger: state
        entity_id: light.hallway
        to: "on"
        for:
          minutes: 30
        id: long
    conditions:
      - condition: or
        conditions:
          - condition: trigger
            id: long
          - condition: state
            entity_id: input_select.house_mode
            state: Night
    actions:
      - action: light.turn_off
        target:
          entity_id: light.hallway
    mode: single

  # -------------------------------------------------------------- balconies
  # Balcony doors have magnetic contacts (from the alarm). After dark, opening
  # one switches on the light of that balcony.
  - id: lighting_balcony_door
    alias: Lighting - Balcony light when its door opens after dark
    triggers:
      - trigger: door.opened
        target:
          entity_id:
            - binary_sensor.balcony_east_door
            - binary_sensor.balcony_south_door
    conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: input_select.house_mode
        state: Home
    actions:
      - action: light.turn_on
        target:
          area_id: "{{ area_id(trigger.entity_id) }}"
    mode: parallel

  - id: lighting_balcony_off
    alias: Lighting - Balcony light off when door closed for 15 min
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.balcony_east_door
          - binary_sensor.balcony_south_door
        to: "off"
        for:
          minutes: 15
    actions:
      - action: light.turn_off
        target:
          area_id: "{{ area_id(trigger.entity_id) }}"
    mode: parallel

  # ------------------------------------------------------- night path light
  - id: lighting_night_path
    alias: Lighting - Hallway as night path light
    description: >
      At night, someone walking into the bathroom or WC lights the hallway as
      well, so the way back to bed is lit too. The hallway goes off 2 minutes
      after both rooms are empty, and only if this automation switched it on.
    triggers:
      - trigger: occupancy.detected
        target:
          entity_id:
            - binary_sensor.main_wc_presence
            - binary_sensor.master_wc_presence
        id: going
      - trigger: state
        entity_id:
          - binary_sensor.main_wc_presence
          - binary_sensor.master_wc_presence
        to: "off"
        for:
          minutes: 2
        id: back
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: going
              - condition: state
                entity_id: input_select.house_mode
                state: Night
              - condition: state
                entity_id: light.hallway
                state: "off"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.hallway
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hallway_path_light
          - conditions:
              - condition: trigger
                id: back
              - condition: state
                entity_id: input_boolean.hallway_path_light
                state: "on"
              - condition: state
                entity_id: binary_sensor.main_wc_presence
                state: "off"
              - condition: state
                entity_id: binary_sensor.master_wc_presence
                state: "off"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.hallway
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hallway_path_light
    mode: queued
